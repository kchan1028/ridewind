<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How RideWind works, in five steps</title>
  <desc id="d">1. You load a GPX route. 2. RideWind picks up to 20 points along it, about 5 km apart. 3. It works out when you'll reach each point, from your average speed or your power. 4. It takes the Open-Meteo forecast for that hour at that point. 5. It compares the wind with your direction of travel and labels each section headwind, crosswind or tailwind, then gives a one-line verdict and the best departure time.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f4f6fa; stroke: #d5dbe5; }
    .num { fill: #14213d; }
    .numtxt { fill: #ffffff; font-weight: 700; font-size: 15px; }
    .h { fill: #14213d; font-weight: 700; font-size: 16px; }
    .p { fill: #3b4659; font-size: 13px; }
    .arrow { stroke: #8a95a8; stroke-width: 2; fill: none; }
    .head { fill: #8a95a8; }
    .lead { fill: #14213d; font-size: 15px; font-weight: 600; }
    .hw { stroke: #c8102e; } .cw { stroke: #d98e04; } .tw { stroke: #1f6fb2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .num { fill: #e6edf3; }
      .numtxt { fill: #0d1117; }
      .h, .lead { fill: #e6edf3; }
      .p { fill: #9da7b3; }
      .arrow { stroke: #6e7681; } .head { fill: #6e7681; }
      .hw { stroke: #ff6b7d; } .cw { stroke: #f2b544; } .tw { stroke: #6fb3ee; }
    }
  </style>
  <rect class="bg" width="960" height="300" rx="12"/>
  <text class="lead" x="24" y="36">RideWind matches the forecast to the time you reach each part of the route.</text>

  <g transform="translate(24,60)">
    <rect class="card" width="164" height="210" rx="10"/>
    <circle class="num" cx="26" cy="28" r="14"/><text class="numtxt" x="26" y="33" text-anchor="middle">1</text>
    <text class="h" x="16" y="70">Load a route</text>
    <text class="p" x="16" y="96">Import a GPX file</text>
    <text class="p" x="16" y="114">or pick a sample.</text>
    <text class="p" x="16" y="140">The file stays in</text>
    <text class="p" x="16" y="158">your browser.</text>
  </g>
  <g transform="translate(212,60)">
    <rect class="card" width="164" height="210" rx="10"/>
    <circle class="num" cx="26" cy="28" r="14"/><text class="numtxt" x="26" y="33" text-anchor="middle">2</text>
    <text class="h" x="16" y="70">Pick points</text>
    <text class="p" x="16" y="96">Up to 20 points,</text>
    <text class="p" x="16" y="114">about 5 km apart.</text>
    <text class="p" x="16" y="140">Rounded to ~100 m</text>
    <text class="p" x="16" y="158">before they're sent.</text>
  </g>
  <g transform="translate(400,60)">
    <rect class="card" width="164" height="210" rx="10"/>
    <circle class="num" cx="26" cy="28" r="14"/><text class="numtxt" x="26" y="33" text-anchor="middle">3</text>
    <text class="h" x="16" y="70">Time each point</text>
    <text class="p" x="16" y="96">From your average</text>
    <text class="p" x="16" y="114">speed, or from your</text>
    <text class="p" x="16" y="132">power, weight, the</text>
    <text class="p" x="16" y="150">slope and the wind.</text>
  </g>
  <g transform="translate(588,60)">
    <rect class="card" width="164" height="210" rx="10"/>
    <circle class="num" cx="26" cy="28" r="14"/><text class="numtxt" x="26" y="33" text-anchor="middle">4</text>
    <text class="h" x="16" y="70">Match the hour</text>
    <text class="p" x="16" y="96">Open-Meteo wind,</text>
    <text class="p" x="16" y="114">gusts, rain and</text>
    <text class="p" x="16" y="132">temperature for the</text>
    <text class="p" x="16" y="150">hour you arrive.</text>
  </g>
  <g transform="translate(776,60)">
    <rect class="card" width="160" height="210" rx="10"/>
    <circle class="num" cx="26" cy="28" r="14"/><text class="numtxt" x="26" y="33" text-anchor="middle">5</text>
    <text class="h" x="16" y="70">Label the wind</text>
    <line class="hw" x1="16" y1="92" x2="44" y2="92" stroke-width="5" stroke-linecap="round"/><text class="p" x="52" y="96">Headwind</text>
    <line class="cw" x1="16" y1="112" x2="44" y2="112" stroke-width="5" stroke-linecap="round"/><text class="p" x="52" y="116">Crosswind</text>
    <line class="tw" x1="16" y1="132" x2="44" y2="132" stroke-width="5" stroke-linecap="round"/><text class="p" x="52" y="136">Tailwind</text>
    <text class="p" x="16" y="166">Then a one-line</text>
    <text class="p" x="16" y="184">verdict and the</text>
    <text class="p" x="16" y="202">best time to leave.</text>
  </g>

  <g>
    <path class="arrow" d="M190 165 H208"/><path class="head" d="M210 165 l-7 -5 v10 z"/>
    <path class="arrow" d="M378 165 H396"/><path class="head" d="M398 165 l-7 -5 v10 z"/>
    <path class="arrow" d="M566 165 H584"/><path class="head" d="M586 165 l-7 -5 v10 z"/>
    <path class="arrow" d="M754 165 H772"/><path class="head" d="M774 165 l-7 -5 v10 z"/>
  </g>
</svg>
