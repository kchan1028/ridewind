<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How RideWind reads the forecast at your arrival time</title>
  <desc id="d">Example: you arrive at 10:40. Wind speed is 12 km/h at 10:00 and 18 km/h at 11:00, so RideWind blends them to 16 km/h. Rain is reported for the hour before each timestamp, so the 0.4 mm reported at 11:00, covering 10:00 to 11:00, is used, and the 1.2 mm reported at 12:00 is not.</desc>
  <style>
    .bg { fill: #ffffff; }
    .h { fill: #14213d; font-weight: 700; font-size: 17px; }
    .sub { fill: #3b4659; font-size: 13px; }
    .lbl { fill: #14213d; font-size: 14px; font-weight: 600; }
    .p { fill: #3b4659; font-size: 13px; }
    .m { fill: #5f6b7a; font-size: 12px; }
    .axis { stroke: #8a95a8; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .h, .lbl { fill: #e6edf3; }
      .sub, .p { fill: #9da7b3; }
      .m { fill: #8b949e; }
      .axis { stroke: #6e7681; }
    }
    .line { stroke: #2a78d6; stroke-width: 2; fill: none; }
    .dot { fill: #2a78d6; stroke: #ffffff; stroke-width: 2; }
    .hit { fill: #14213d; stroke: #ffffff; stroke-width: 2; }
    .arr { stroke: #14213d; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .rainOn { fill: #2a78d6; fill-opacity: .22; stroke: #2a78d6; stroke-width: 2; }
    .rainOff { fill: #8a95a8; fill-opacity: .12; stroke: #8a95a8; stroke-width: 1.5; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #6da7ec; } .dot { fill: #6da7ec; stroke: #0d1117; }
      .hit { fill: #e6edf3; stroke: #0d1117; } .arr { stroke: #e6edf3; }
      .rainOn { fill: #6da7ec; stroke: #6da7ec; }
      .rainOff { fill: #6e7681; stroke: #6e7681; }
    }
  </style>
  <rect class="bg" width="760" height="370" rx="12"/>
  <text class="h" x="24.0" y="36.0" text-anchor="start">Wind is blended between hours. Rain uses the hour you're in.</text>
  <text class="lbl" x="24.0" y="72.0" text-anchor="start">Wind speed</text>
  <text class="m" x="24.0" y="90.0" text-anchor="start">Open-Meteo gives one value per hour.</text>
  <polyline class="line" points="90.0,148.0 390.0,112.0 690.0,130.0"/>
  <circle class="dot" cx="90.0" cy="148.0" r="5"/>
  <text class="p" x="90.0" y="136.0" text-anchor="middle">12 km/h</text>
  <circle class="dot" cx="390.0" cy="112.0" r="5"/>
  <text class="p" x="390.0" y="100.0" text-anchor="middle">18 km/h</text>
  <circle class="dot" cx="690.0" cy="130.0" r="5"/>
  <text class="p" x="690.0" y="118.0" text-anchor="middle">15 km/h</text>
  <circle class="hit" cx="290.0" cy="124.0" r="6"/>
  <text class="lbl" x="302.0" y="148.0" text-anchor="start">16 km/h at 10:40: two thirds of the way from 12 to 18</text>
  <text class="lbl" x="24.0" y="202.0" text-anchor="start">Rain</text>
  <rect class="rainOn" x="90.0" y="214" width="296" height="34" rx="4"/>
  <rect class="rainOff" x="394.0" y="214" width="296" height="34" rx="4"/>
  <text class="lbl" x="102.0" y="236.0" text-anchor="start">0.4 mm, reported at 11:00. Used.</text>
  <text class="p" x="406.0" y="236.0" text-anchor="start">1.2 mm, reported at 12:00. Not used.</text>
  <line class="arr" x1="290.0" y1="100" x2="290.0" y2="208"/>
  <line class="arr" x1="290.0" y1="254" x2="290.0" y2="282"/>
  <text class="lbl" x="290.0" y="304.0" text-anchor="middle">You arrive at 10:40</text>
  <line class="axis" x1="90" y1="282" x2="690" y2="282"/>
  <line class="axis" x1="90" y1="276" x2="90" y2="288"/>
  <text class="m" x="90.0" y="304.0" text-anchor="middle">10:00</text>
  <line class="axis" x1="390" y1="276" x2="390" y2="288"/>
  <text class="m" x="390.0" y="304.0" text-anchor="middle">11:00</text>
  <line class="axis" x1="690" y1="276" x2="690" y2="288"/>
  <text class="m" x="690.0" y="304.0" text-anchor="middle">12:00</text>
  <text class="m" x="24.0" y="336.0" text-anchor="start">Example values. Temperature is blended like wind speed. Wind direction is blended the short way round the compass.</text>
  <text class="m" x="24.0" y="354.0" text-anchor="start">Chance of rain and gusts work like rain: each value covers the hour before its timestamp.</text>
</svg>
